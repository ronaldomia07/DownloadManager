# GitHub Actions — Automatic Prebuilt Releases (v3, packaging fixed)
# ===================================================================
# Save as:  .github/workflows/build.yml
#
# Fix vs v2: Windows has no `zip` command in Git Bash — packaging now
# uses PowerShell Compress-Archive on Windows and zip on macOS/Linux.
# (The PyInstaller build itself already succeeded on Windows.)

name: Build Releases

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: DownloadManager-Windows
            ffexec: ffmpeg.exe
            sep: ";"
          - os: macos-latest
            artifact: DownloadManager-macOS
            ffexec: ffmpeg
            sep: ":"
          - os: ubuntu-latest
            artifact: DownloadManager-Linux
            ffexec: ffmpeg
            sep: ":"

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.artifact }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller yt-dlp requests

      - name: Install FFmpeg
        shell: bash
        run: |
          mkdir ffmpeg_bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
            unzip -o ffmpeg.zip -d ffmpeg_tmp
            find ffmpeg_tmp -name "ffmpeg.exe" -exec cp {} ffmpeg_bin/ \;
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
            cp "$(brew --prefix ffmpeg)/bin/ffmpeg" ffmpeg_bin/
          else
            curl -L -o ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xf ffmpeg.tar.xz
            find . -maxdepth 2 -name "ffmpeg" -type f -exec cp {} ffmpeg_bin/ \;
          fi

      - name: Build executable
        shell: bash
        env:
          FFEXEC: ${{ matrix.ffexec }}
          SEP: ${{ matrix.sep }}
        run: |
          python -m PyInstaller \
            --name DownloadManager \
            --onedir \
            --windowed \
            --collect-all yt_dlp \
            --hidden-import yt_dlp.extractor \
            --add-binary "ffmpeg_bin/${FFEXEC}${SEP}." \
            download_manager.py

      - name: Make executable runnable on unix
        if: runner.os != 'Windows'
        run: chmod +x dist/DownloadManager/DownloadManager

      # Windows: zip is unavailable in Git Bash → use PowerShell instead
      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DownloadManager -DestinationPath ${{ matrix.artifact }}.zip -Force

      - name: Package artifact (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          zip -r "../${{ matrix.artifact }}.zip" DownloadManager

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
